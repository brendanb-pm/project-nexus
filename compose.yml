services:
  nexus-postgres:
    image: postgres:16.8-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus_dev
      POSTGRES_USER: nexus_app
      POSTGRES_PASSWORD: nexus_local_only
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_app -d nexus_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  nexus_pgdata:
