name: nexus-local

services:
  nexus-postgres:
    image: postgres:16.8-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NEXUS_POSTGRES_DB:?Set NEXUS_POSTGRES_DB in the ignored Docker environment file}
      POSTGRES_USER: ${NEXUS_POSTGRES_USER:?Set NEXUS_POSTGRES_USER in the ignored Docker environment file}
      POSTGRES_PASSWORD: ${NEXUS_POSTGRES_PASSWORD:?Set NEXUS_POSTGRES_PASSWORD in the ignored Docker environment file}
    ports:
      - "127.0.0.1:${NEXUS_POSTGRES_PORT:?Set NEXUS_POSTGRES_PORT in the ignored Docker environment file}:5432"
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - nexus_db
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  nexus_pgdata:

networks:
  nexus_db:
